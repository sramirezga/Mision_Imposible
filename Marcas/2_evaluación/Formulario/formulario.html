<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Ejercicio Formulario - Vídeo</title>
	<link rel="stylesheet" type="text/css" href="css/css.css">
</head>

<body>
	<div id="formulario">
		<h1>Formulario de inscripción</h1>
		<table border="1">
			<tr>
				<td><label for="nombre_apellido">Nombre y Apellidos</label></td>
				<td><input type="text" id="nombre_apellido"></td>
			</tr>

			<tr>
				<td><label for="telefono">Teléfono</label></td>
				<td><input type="tel" id="telefono"></td>
			</tr>

			<tr>
				<td><label>Vehículo</label></td>
				<td>
					<label for="coche">Coche</label>
					<input type="radio" name="vehiculo" value="Coche" id="coche">
					<label for="moto">Moto</label>
					<input type="radio" name="vehiculo" value="Moto" id="moto">
				</td>
			</tr>

			<tr>
				<td><label for="f_tipo_examen">Tipo de examen</label></td>
				<td>
					<input list="tipo_examenes" id="tipo_examen">
					<datalist id="tipo_examenes">
						<option value="Teórico">
						<option value="Pista">
						<option value="Carretera">
					</datalist>
				</td>
			</tr>

			<!--<tr>
				<td><label for="f_tipo_examen2">Tipo de examen</label></td>
				<td>
					<select id="tipo_examen2">
					  <option value="vacio" selected disabled></option>
					  <option value="teorico">Teórico</option>
					  <option value="pista">Pista</option>
					  <option value="carretera">Carretera</option>
					</select>
				</td>
			</tr>-->

			<tr>
				<td><label>Disponibilidad</label></td>
				<td>
					<label>Lunes</label><input type="checkbox" name="disponibilidad" value="Lunes">
					<label>Martes</label><input type="checkbox" name="disponibilidad" value="Martes">
					<label>Miércoles</label><input type="checkbox" name="disponibilidad" value="Miércoles">
					<label>Jueves</label><input type="checkbox" name="disponibilidad" value="Jueves">
					<label>Viernes</label><input type="checkbox" name="disponibilidad" value="Viernes">
				</td>
			</tr>

			<tr>
				<td><label>Notas:</label></td>
				<td>
					<textarea id="notas" cols="50" rows="3"></textarea>
				</td>
			</tr>

			<tr>
				<td colspan="2">
					<input type="button" value="Agregar" onclick="agregar_usuario()">
					<input type="button" value="Resetear" onclick="reset()">
				</td>
			</tr>

		</table>
	</div>

	<div id="lista">
		<h1>Lista de usuarios inscritos</h1>

		<table border="1" id="lista_usuarios">
			<tr>
				<td>NOMBRE Y APELLIDOS</td>
				<td>TELÉFONO</td>
				<td>VEHÍCULO</td>
				<td>TIPO DE EXAMEN</td>
				<td>TIPO DE EXAMEN*</td>
				<td>DISPONIBILIDAD</td>
				<td>NOTAS</td>
			</tr>
		</table>
		<div id="div_boton_volver">
			<input type="button" value="Volver" onclick="volver()">
		</div>
		
	</div>

<!-- empieza JavaScript	-->

	<script src="js/js.js">
		
	</script>

</body>
</html>
